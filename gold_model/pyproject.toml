[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-model"
version = "5.0.0"
description = "黄金多因子预测模型 V5 — 数据采集 → ML建模(VIF剔除+Holdout验证) → 信号告警 → Dashboard/报告"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "xgboost",
    "lightgbm",
    "yfinance",
    "requests",
    "beautifulsoup4",
    "matplotlib",
    "reportlab",
    "pypdf",
    "openpyxl",
    "curl_cffi",
    "statsmodels",
]

[project.optional-dependencies]
pdf = ["playwright"]  # generate_cover.py 需要
dev = ["pytest"]      # tests/ 冒烟测试
api = ["fastapi", "uvicorn", "pydantic"]  # api_server.py 后端

[project.scripts]
gold-dashboard = "gold_model.web_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gold_model.execution_plan" = ["assets/*.html"]
